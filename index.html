<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaMe</title>
  <style>
    :root {
      --bg: #050505;
      --bg-2: #0c0c0c;
      --panel: rgba(19, 19, 19, 0.42);
      --panel-strong: rgba(10, 10, 10, 0.82);
      --panel-soft: rgba(25, 25, 25, 0.34);
      --line: rgba(255,255,255,0.09);
      --line-strong: rgba(255,255,255,0.16);
      --text: #f4f4f4;
      --muted: #bdbdbd;
      --red-1: #120507;
      --red-2: #24080d;
      --red-3: #4d0d17;
      --red-4: #7f1421;
      --red-5: #b10d1d;
      --red-6: #d92d42;
      --white: #ffffff;
      --shadow: rgba(0,0,0,0.75);
      --glow: rgba(217,45,66,0.18);
      --glow-strong: rgba(217,45,66,0.38);
      --glass: rgba(255,255,255,0.02);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 0%, rgba(177,13,30,0.22), transparent 28%),
        radial-gradient(circle at 82% 10%, rgba(217,45,66,0.12), transparent 24%),
        linear-gradient(180deg, #040404 0%, #0a0a0a 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), transparent 22%, transparent 78%, rgba(255,255,255,0.015)),
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.01),
          rgba(255,255,255,0.01) 1px,
          transparent 1px,
          transparent 5px
        );
      pointer-events: none;
      z-index: 0;
    }

    .page {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 28px 18px 60px;
      position: relative;
      z-index: 1;
    }

    .hero {
      padding: 12px 0 18px;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
    }

    .brand-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 20px;
    }

    .brand {
      margin: 0;
      font-size: clamp(30px, 7vw, 72px);
      line-height: 0.92;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      font-weight: 900;
      color: var(--text);
    }

    .brand .accent { color: var(--red-6); text-shadow: 0 0 22px rgba(217,45,66,0.26); }

    .badge {
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 9px;
      opacity: 0.82;
    }

    .panel {
      position: relative;
      background: linear-gradient(180deg, rgba(24,24,24,0.44), rgba(12,12,12,0.7));
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow:
        0 18px 48px rgba(0,0,0,0.38),
        inset 0 1px 0 rgba(255,255,255,0.04),
        inset 0 0 28px rgba(255,255,255,0.02),
        0 0 22px rgba(217,45,66,0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(255,255,255,0.03), transparent 24%, transparent 76%, rgba(177,13,30,0.08));
      pointer-events: none;
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: auto 12% 10% 12%;
      height: 54%;
      background: radial-gradient(circle at center, rgba(217,45,66,0.12), transparent 70%);
      filter: blur(26px);
      pointer-events: none;
    }

    .release-card { padding: 18px; }

    .release-top,
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .title,
    .card-title {
      margin: 0;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--text);
    }

    .title { font-size: clamp(18px, 3vw, 30px); }
    .card-title { font-size: clamp(16px, 2.6vw, 24px); }

    .small-tag {
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 9px;
      opacity: 0.8;
    }

    .release-main {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 22px;
      align-items: center;
    }

    .cover-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      transform-style: preserve-3d;
    }

    .cover-wrap::before {
      content: "";
      position: absolute;
      inset: -16px;
      background: radial-gradient(circle, rgba(217,45,66,0.22), rgba(217,45,66,0.08) 30%, transparent 68%);
      filter: blur(28px);
      z-index: 0;
    }

    .cover {
      position: relative;
      z-index: 1;
      width: 100%;
      aspect-ratio: 1;
      display: block;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.09);
      background: #171717;
      box-shadow:
        0 20px 34px rgba(0,0,0,0.48),
        inset 0 0 26px rgba(255,255,255,0.02),
        0 0 26px rgba(217,45,66,0.15);
      cursor: pointer;
      transition: transform 0.45s cubic-bezier(.22,1,.36,1), box-shadow 0.45s ease, filter 0.45s ease, border-color 0.45s ease;
      transform-style: preserve-3d;
      will-change: transform, filter;
    }

    .cover-wrap:hover .cover {
      transform: scale(1.03) rotate(-1deg) translateZ(10px);
      filter: saturate(1.13) contrast(1.1) brightness(1.06);
      box-shadow:
        0 28px 50px rgba(0,0,0,0.6),
        0 0 32px rgba(177,13,30,0.18),
        0 0 48px rgba(217,45,66,0.12);
    }

    .cover.bump {
      animation: coverPop 0.9s cubic-bezier(.22, 1, .36, 1);
      border-color: rgba(255,255,255,0.14);
      box-shadow:
        0 28px 42px rgba(0,0,0,0.55),
        0 0 28px rgba(217,45,66,0.26),
        0 0 46px rgba(217,45,66,0.16);
    }

    @keyframes coverPop {
      0% {
        transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
      }
      12% {
        transform: translate3d(-8px, 10px, 0) scale(1.03) rotate(-4deg);
      }
      26% {
        transform: translate3d(12px, -12px, 0) scale(1.06) rotate(4deg);
      }
      46% {
        transform: translate3d(-6px, 8px, 0) scale(1.02) rotate(-2deg);
      }
      70% {
        transform: translate3d(4px, -4px, 0) scale(1.01) rotate(1deg);
      }
      100% {
        transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
      }
    }

    .cover-hint {
      position: absolute;
      right: -4px;
      bottom: -12px;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
      z-index: 2;
    }

    .cover-wrap:hover .cover-hint {
      opacity: 1;
      transform: translateY(0);
    }

    .release-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 12px 18px;
      border-radius: 12px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 10px;
      font-weight: 800;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, filter 0.2s ease, background 0.2s ease;
      user-select: none;
    }

    .button.primary {
      background: linear-gradient(180deg, var(--red-5), var(--red-4));
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 14px 26px rgba(177,13,30,0.24), 0 0 0 1px rgba(255,255,255,0.02), 0 0 18px rgba(217,45,66,0.12);
    }

    .button.secondary {
      background: rgba(255,255,255,0.02);
      color: var(--text);
      border: 1px solid var(--line-strong);
      box-shadow: inset 0 0 18px rgba(255,255,255,0.02);
    }

    .button:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
      box-shadow: 0 18px 30px rgba(0,0,0,0.22), 0 0 18px rgba(217,45,66,0.14);
    }

    .stack { display: grid; gap: 18px; margin-top: 18px; }

    .card { padding: 18px 16px; }

    .accounts-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .reveal {
      opacity: 0;
      transform: translateY(28px);
      filter: blur(10px);
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(.22,1,.36,1), filter 0.8s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }

    .scroll-ghost {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 92px;
      height: 60px;
      z-index: 25;
      pointer-events: none;
    }

    .scroll-ghost::before,
    .scroll-ghost::after,
    .scroll-ghost .ghost {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 14px;
      background: rgba(12, 12, 12, 0.72);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 12px 28px rgba(0,0,0,0.35), 0 0 18px rgba(217,45,66,0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .scroll-ghost::before {
      transform: translate(-14px, 12px) scale(1.08);
      opacity: 0.22;
      filter: blur(14px);
    }

    .scroll-ghost::after {
      transform: translate(-8px, 6px) scale(1.04);
      opacity: 0.4;
      filter: blur(10px);
    }

    .scroll-ghost .ghost {
      position: absolute;
      inset: 0;
      background: rgba(12, 12, 12, 0.8);
      opacity: 1;
    }

    @media (max-width: 720px) {
      .release-main { grid-template-columns: 1fr; }
      .brand-row { flex-direction: column; align-items: flex-start; }
      .scroll-ghost { right: 12px; bottom: 12px; width: 82px; height: 54px; }
    }

    @media (max-width: 540px) {
      .page { padding-left: 14px; padding-right: 14px; }
      .release-actions, .accounts-grid { grid-template-columns: 1fr; }
      .brand { letter-spacing: 0.18em; }
      .title { letter-spacing: 0.12em; }
    }
  </style>
</head>
<body>
  <div class="scroll-ghost" aria-hidden="true">
    <div class="ghost"></div>
  </div>

  <div class="page">
    <header class="hero reveal">
      <div class="brand-row">
        <h1 class="brand">La<span class="accent">Me</span></h1>
        <div class="badge">official</div>
      </div>
    </header>

    <main class="stack">
      <section class="panel release-card reveal">
        <div class="release-top">
          <h2 class="title">Suppressed Scream</h2>
          <div class="small-tag">single</div>
        </div>

        <div class="release-main">
          <div class="cover-wrap">
            <img class="cover" src="./ac.png" alt="Suppressed Scream cover art" />
            <div class="cover-hint">press</div>
          </div>

          <div class="release-actions">
            <a class="button primary" href="https://youtu.be/mz3qG9PVwJc?si=T6bikvwP0WClXUt5" target="_blank" rel="noreferrer">YouTube</a>
            <a class="button secondary" href="https://www.bandlab.com/post/385c45b9-63f3-440d-a55e-360ce27cd58b" target="_blank" rel="noreferrer">BandLab</a>
          </div>
        </div>
      </section>

      <section class="panel card reveal">
        <div class="card-head">
          <h2 class="card-title">Accounts</h2>
          <div class="small-tag">follow</div>
        </div>

        <div class="accounts-grid">
          <a class="button primary" href="https://www.youtube.com/@LaMe_is_trash" target="_blank" rel="noreferrer">YouTube</a>
          <a class="button secondary" href="https://www.instagram.com/lame_is_trash?cplk=eDV3OGV2b3YwOWNj&utm_source=qr" target="_blank" rel="noreferrer">Instagram</a>
          <a class="button secondary" href="https://www.bandlab.com/lame_official" target="_blank" rel="noreferrer">BandLab</a>
        </div>
      </section>
    </main>
  </div>

  <script>
    const revealItems = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.18, rootMargin: '0px 0px -30px 0px' });
    revealItems.forEach((item) => observer.observe(item));

    const cover = document.querySelector('.cover');
    if (cover) {
      cover.addEventListener('click', () => {
        cover.classList.remove('bump');
        void cover.offsetWidth;
        cover.classList.add('bump');

        clearTimeout(cover._pressTimer);
        cover._pressTimer = setTimeout(() => {
          cover.classList.remove('bump');
        }, 900);
      });
    }

    const ghost = document.querySelector('.scroll-ghost');
    let lastScroll = window.scrollY;

    if (ghost) {
      const updateGhost = () => {
        const current = window.scrollY;
        const diff = Math.abs(current - lastScroll);
        const offsetX = Math.min(26, diff * 0.18);
        const offsetY = Math.min(18, diff * 0.14);

        ghost.style.transform = `translate(${offsetX}px, ${Math.max(0, 8 - offsetY)}px)`;
        ghost.style.filter = `blur(${Math.min(6, diff * 0.02)}px)`;
        ghost.style.opacity = String(Math.min(1, 0.35 + diff / 200));

        lastScroll = current;
      };

      window.addEventListener('scroll', updateGhost, { passive: true });
    }
  </script>
</body>
</html>
