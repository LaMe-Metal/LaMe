<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaMe</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --line: #2b2b2b;
      --text: #f3f3f3;
      --muted: #a5a5a5;
      --red: #b61125;
      --panel: #101010;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: min(100%, 720px);
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 18px;
    }

    .brand {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .brand span {
      color: var(--red);
    }

    .upload-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    input[type="file"] {
      display: none;
    }

    .fake-btn {
      display: inline-block;
      background: var(--red);
      color: var(--text);
      border: 1px solid var(--red);
      padding: 10px 14px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
    }

    .status {
      display: none;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      border: 1px solid var(--line);
      background: #0e0e0e;
      color: var(--text);
      padding: 8px 12px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .status.show {
      display: flex;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #444;
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .status.loading .spinner {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .video-box {
      display: none;
      margin-top: 12px;
      border: 1px solid var(--line);
      background: #0d0d0d;
      padding: 10px;
    }

    .video-box.show {
      display: block;
    }

    video {
      width: 100%;
      display: block;
      background: #000;
    }

    .file-name {
      margin-top: 10px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      word-break: break-all;
    }

    .bandlab {
      margin-top: 18px;
      border: 1px solid var(--line);
      background: #0d0d0d;
      padding: 12px;
    }

    .bandlab h2 {
      margin: 0 0 12px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .bandlab-frame {
      width: 100%;
      min-height: 420px;
      border: 0;
      background: #000;
    }

    .version {
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: #111;
      border: 1px solid var(--line);
      padding: 5px 8px;
      color: var(--text);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="brand">La<span>Me</span></div>

    <div class="upload-wrap">
      <label class="fake-btn" for="mp4Input">Upload MP4</label>
      <input id="mp4Input" type="file" accept="video/mp4,video/x-m4v,video/quicktime,.mp4,.m4v,.mov" />
    </div>

    <div id="status" class="status">
      <div class="spinner"></div>
      <span id="statusText">Uploading...</span>
    </div>

    <div id="videoBox" class="video-box">
      <video id="videoPlayer" controls playsinline></video>
      <div id="fileName" class="file-name"></div>
    </div>

    <div class="bandlab">
      <h2>BandLab</h2>
      <iframe
        class="bandlab-frame"
        src="https://www.bandlab.com/embed/?id=385c45b9-63f3-440d-a55e-360ce27cd58b"
        title="BandLab player"
        loading="lazy"
        allow="autoplay; clipboard-write; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
  </div>

  <div class="version">v0.10</div>

  <script>
    const STORAGE_KEY = 'lame_last_mp4';
    const FILE_NAME_KEY = 'lame_last_mp4_name';

    const mp4Input = document.getElementById('mp4Input');
    const status = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const videoBox = document.getElementById('videoBox');
    const videoPlayer = document.getElementById('videoPlayer');
    const fileName = document.getElementById('fileName');

    function showStatus(text, loading) {
      status.classList.add('show');
      status.classList.toggle('loading', !!loading);
      statusText.textContent = text;
    }

    function hideStatus() {
      status.classList.remove('show');
      status.classList.remove('loading');
    }

    function readAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function isAllowedVideo(file) {
      if (!file) return false;
      const type = (file.type || '').toLowerCase();
      const name = (file.name || '').toLowerCase();
      return type.includes('mp4') || type.includes('m4v') || type.includes('quicktime') || /\.(mp4|m4v|mov)$/i.test(name);
    }

    function saveVideo(file, dataUrl) {
      localStorage.setItem(STORAGE_KEY, dataUrl);
      localStorage.setItem(FILE_NAME_KEY, file.name);
    }

    function loadSavedVideo() {
      const saved = localStorage.getItem(STORAGE_KEY);
      const name = localStorage.getItem(FILE_NAME_KEY);

      if (!saved) return;

      videoPlayer.src = saved;
      videoPlayer.load();
      videoBox.classList.add('show');
      if (name) fileName.textContent = name;
    }

    async function handleMp4(file) {
      if (!file) return;

      if (!isAllowedVideo(file)) {
        showStatus('Only MP4', false);
        setTimeout(() => hideStatus(), 1200);
        return;
      }

      if (file.size > 80 * 1024 * 1024) {
        showStatus('File too large', false);
        setTimeout(() => hideStatus(), 1200);
        return;
      }

      showStatus('Uploading...', true);

      try {
        const dataUrl = await readAsDataUrl(file);
        saveVideo(file, dataUrl);
        videoPlayer.src = dataUrl;
        videoPlayer.load();
        fileName.textContent = file.name;
        videoBox.classList.add('show');
      } catch (error) {
        showStatus('Error', false);
      } finally {
        mp4Input.value = '';
      }

      setTimeout(() => {
        hideStatus();
      }, 900);
    }

    mp4Input.addEventListener('change', (event) => {
      const file = event.target && event.target.files ? event.target.files[0] : null;
      handleMp4(file);
    });

    loadSavedVideo();
  </script>
</body>
</html>
