<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaMe</title>
  <style>
    :root {
      --bg: #080808;
      --bg-2: #101010;
      --panel: rgba(15, 15, 15, 0.96);
      --panel-soft: rgba(20, 20, 20, 0.95);
      --line: rgba(255,255,255,0.08);
      --line-strong: rgba(255,255,255,0.16);
      --text: #f5f5f5;
      --muted: #b5b5b5;
      --red-1: #120507;
      --red-2: #26080d;
      --red-3: #4c0d15;
      --red-4: #7b1220;
      --red-5: #b10d1e;
      --red-6: #d52238;
      --white: #ffffff;
      --shadow: rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 0%, rgba(177, 13, 30, 0.22), transparent 25%),
        radial-gradient(circle at 80% 15%, rgba(213, 34, 56, 0.14), transparent 22%),
        linear-gradient(180deg, #070707 0%, #0b0b0b 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .shell {
      width: min(100%, 860px);
      background: linear-gradient(180deg, rgba(16,16,16,0.97), rgba(9,9,9,0.98));
      border: 1px solid var(--line);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.02),
        0 28px 70px rgba(0,0,0,0.7),
        inset 0 0 24px rgba(177,13,30,0.04);
      padding: clamp(18px, 3vw, 34px);
      position: relative;
      overflow: hidden;
    }

    .shell::before,
    .shell::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .shell::before {
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(177,13,30,0.08) 16%,
        transparent 34%,
        transparent 66%,
        rgba(177,13,30,0.08) 84%,
        transparent 100%
      );
    }

    .shell::after {
      inset: 14px;
      border: 1px solid rgba(255,255,255,0.04);
    }

    .brand-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 18px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      margin: 0;
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 900;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      line-height: 0.9;
      color: var(--text);
    }

    .brand span {
      color: var(--red-6);
      text-shadow: 0 0 18px rgba(213, 34, 56, 0.22);
    }

    .tag {
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 9px;
      opacity: 0.85;
      white-space: nowrap;
    }

    .stack {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 18px;
    }

    .card {
      background: linear-gradient(180deg, rgba(18,18,18,0.96), rgba(10,10,10,0.96));
      border: 1px solid var(--line);
      padding: 20px 18px 18px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.015);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .title {
      margin: 0;
      font-size: clamp(16px, 2.3vw, 28px);
      letter-spacing: 0.17em;
      text-transform: uppercase;
      color: var(--text);
      font-weight: 800;
    }

    .small-label {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 12px 18px;
      background: linear-gradient(180deg, var(--red-5), var(--red-4));
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--white);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 10px;
      font-weight: 800;
      transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 12px 20px rgba(177, 13, 30, 0.22);
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .btn.secondary {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-color: var(--line-strong);
      box-shadow: none;
    }

    .btn.secondary:hover {
      background: rgba(255,255,255,0.02);
      border-color: rgba(255,255,255,0.18);
    }

    @media (max-width: 620px) {
      .list {
        grid-template-columns: 1fr;
      }

      .brand-wrap {
        flex-direction: column;
        align-items: flex-start;
      }

      .brand {
        letter-spacing: 0.18em;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand-wrap">
      <h1 class="brand">La<span>Me</span></h1>
      <div class="tag">Official</div>
    </div>

    <div class="stack">
      <section class="card">
        <div class="card-header">
          <h2 class="title">Suppressed Scream</h2>
          <div class="small-label">Single</div>
        </div>

        <div class="list">
          <a class="btn" href="https://youtu.be/mz3qG9PVwJc?si=T6bikvwP0WClXUt5" target="_blank" rel="noreferrer">YouTube</a>
          <a class="btn secondary" href="https://www.bandlab.com/post/385c45b9-63f3-440d-a55e-360ce27cd58b" target="_blank" rel="noreferrer">BandLab</a>
        </div>
      </section>

      <section class="card">
        <div class="card-header">
          <h2 class="title">Accounts</h2>
          <div class="small-label">Follow</div>
        </div>

        <div class="list">
          <a class="btn" href="https://www.youtube.com/@LaMe_is_trash" target="_blank" rel="noreferrer">YouTube</a>
          <a class="btn secondary" href="https://www.instagram.com/lame_is_trash?cplk=eDV3OGV2b3YwOWNj&utm_source=qr" target="_blank" rel="noreferrer">Instagram</a>
          <a class="btn secondary" href="https://www.bandlab.com/lame_official" target="_blank" rel="noreferrer">BandLab</a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
