<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaMe</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --panel: #111111;
      --line: #2b2b2b;
      --text: #f3f3f3;
      --muted: #a3a3a3;
      --red: #b61125;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .box {
      width: min(100%, 760px);
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 24px;
    }

    .brand {
      margin: 0 0 24px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .brand span {
      color: var(--red);
    }

    .section {
      margin-top: 20px;
      padding: 18px 16px;
      border: 1px solid var(--line);
      background: #0d0d0d;
    }

    .label {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .link-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 12px 16px;
      border: 1px solid var(--red);
      background: var(--red);
      color: var(--text);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 10px;
      font-weight: 700;
    }

    .plain-link {
      display: block;
      margin-top: 12px;
      color: var(--text);
      text-decoration: none;
      word-break: break-all;
      line-height: 1.6;
      font-size: 14px;
    }

    .plain-link:hover {
      text-decoration: underline;
    }

    .youtube-box {
      margin-top: 12px;
      padding: 14px 12px;
      border: 1px dashed var(--line);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="box">
    <div class="brand">La<span>Me</span></div>

    <section class="section">
      <h2 class="label">BandLab</h2>
      <a class="link-btn" href="https://www.bandlab.com/post/385c45b9-63f3-440d-a55e-360ce27cd58b" target="_blank" rel="noreferrer">
        Open in BandLab
      </a>
      <a class="plain-link" href="https://www.bandlab.com/post/385c45b9-63f3-440d-a55e-360ce27cd58b" target="_blank" rel="noreferrer">
        https://www.bandlab.com/post/385c45b9-63f3-440d-a55e-360ce27cd58b
      </a>
    </section>

    <section class="section">
      <h2 class="label">YouTube</h2>
      <div class="youtube-box">Přidáme YouTube link později</div>
    </section>
  </main>
</body>
</html>
