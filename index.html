<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaMe</title>
  <style>
    :root {
      --bg: #070707;
      --bg-2: #0d0d0d;
      --panel: rgba(16,16,16,0.96);
      --panel-2: rgba(20,20,20,0.98);
      --line: rgba(255,255,255,0.08);
      --line-strong: rgba(255,255,255,0.16);
      --text: #f4f4f4;
      --muted: #b8b8b8;
      --red-1: #120507;
      --red-2: #2a070d;
      --red-3: #4d0d17;
      --red-4: #7f1321;
      --red-5: #b10d1d;
      --red-6: #d62a3c;
      --white: #ffffff;
      --shadow: rgba(0,0,0,0.72);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 0%, rgba(177,13,30,0.18), transparent 24%),
        radial-gradient(circle at 80% 15%, rgba(214,42,60,0.10), transparent 18%),
        linear-gradient(180deg, #070707 0%, #0a0a0a 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .shell {
      width: min(100%, 840px);
      background: linear-gradient(180deg, rgba(17,17,17,0.96), rgba(8,8,8,0.98));
      border: 1px solid var(--line);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.02),
        0 28px 60px var(--shadow),
        inset 0 0 24px rgba(177,13,30,0.04);
      padding: clamp(18px, 3vw, 30px);
      position: relative;
      overflow: hidden;
    }

    .shell::before,
    .shell::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .shell::before {
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(177,13,30,0.09) 18%,
        transparent 36%,
        transparent 66%,
        rgba(177,13,30,0.09) 82%,
        transparent 100%
      );
    }

    .shell::after {
      inset: 12px;
      border: 1px solid rgba(255,255,255,0.04);
    }

    .brand-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 18px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      margin: 0;
      font-size: clamp(30px, 5vw, 54px);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 900;
      line-height: 0.9;
      color: var(--text);
    }

    .brand span {
      color: var(--red-6);
      text-shadow: 0 0 18px rgba(214,42,60,0.18);
    }

    .tag {
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 9px;
      opacity: 0.8;
      white-space: nowrap;
    }

    .stack {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 18px;
    }

    .card {
      background: linear-gradient(180deg, rgba(18,18,18,0.97), rgba(10,10,10,0.97));
      border: 1px solid var(--line);
      padding: 18px 16px 16px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.015);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .title {
      margin: 0;
      font-size: clamp(15px, 2vw, 24px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--text);
    }

    .label {
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 9px;
      opacity: 0.85;
    }

    .release-wrap {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 18px;
      align-items: center;
    }

    .cover {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      object-fit: cover;
      border: 1px solid var(--line-strong);
      background: #111;
      box-shadow: 0 18px 30px rgba(0,0,0,0.35), inset 0 0 20px rgba(255,255,255,0.02);
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .button-grid a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 12px 16px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 10px;
      font-weight: 800;
      transition: transform 0.18s ease, filter 0.18s ease, border-color 0.18s ease;
    }

    .primary {
      background: linear-gradient(180deg, var(--red-5), var(--red-4));
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--white);
      box-shadow: 0 12px 22px rgba(177,13,30,0.24);
    }

    .secondary {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border: 1px solid var(--line-strong);
      color: var(--text);
    }

    .button-grid a:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    @media (max-width: 620px) {
      .release-wrap {
        grid-template-columns: 1fr;
      }

      .button-grid {
        grid-template-columns: 1fr;
      }

      .brand-wrap {
        flex-direction: column;
        align-items: flex-start;
      }

      .brand {
        letter-spacing: 0.18em;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand-wrap">
      <h1 class="brand">La<span>Me</span></h1>
      <div class="tag">official</div>
    </div>

    <div class="stack">
      <section class="card">
        <div class="card-head">
          <h2 class="title">Suppressed Scream</h2>
          <div class="label">single</div>
        </div>

        <div class="release-wrap">
          <img class="cover" src="https://drive.google.com/uc?export=view&id=1_4xVaMF4WGw56mB0GF-8s9OF2ujP2kLF" alt="Suppressed Scream cover art" />

          <div class="button-grid">
            <a class="primary" href="https://youtu.be/mz3qG9PVwJc?si=T6bikvwP0WClXUt5" target="_blank" rel="noreferrer">YouTube</a>
            <a class="secondary" href="https://www.bandlab.com/post/385c45b9-63f3-440d-a55e-360ce27cd58b" target="_blank" rel="noreferrer">BandLab</a>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2 class="title">Accounts</h2>
          <div class="label">follow</div>
        </div>

        <div class="button-grid">
          <a class="primary" href="https://www.youtube.com/@LaMe_is_trash" target="_blank" rel="noreferrer">YouTube</a>
          <a class="secondary" href="https://www.instagram.com/lame_is_trash?cplk=eDV3OGV2b3YwOWNj&utm_source=qr" target="_blank" rel="noreferrer">Instagram</a>
          <a class="secondary" href="https://www.bandlab.com/lame_official" target="_blank" rel="noreferrer">BandLab</a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
