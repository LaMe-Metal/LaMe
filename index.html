<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaMe</title>
  <style>
    :root {
      --bg: #050505;
      --bg-2: #0e0e0e;
      --panel: rgba(18, 18, 18, 0.78);
      --panel-strong: rgba(12, 12, 12, 0.96);
      --line: rgba(255,255,255,0.08);
      --line-strong: rgba(255,255,255,0.18);
      --text: #f4f4f4;
      --muted: #b8b8b8;
      --red-1: #120507;
      --red-2: #24080d;
      --red-3: #4d0d17;
      --red-4: #7f1421;
      --red-5: #b10d1d;
      --red-6: #d92d42;
      --white: #ffffff;
      --shadow: rgba(0,0,0,0.75);
      --glow: rgba(217,45,66,0.2);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0%, rgba(177,13,30,0.23), transparent 28%),
        radial-gradient(circle at 80% 10%, rgba(217,45,66,0.11), transparent 26%),
        linear-gradient(180deg, #040404 0%, #0a0a0a 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent 20%, transparent 80%, rgba(255,255,255,0.02));
      pointer-events: none;
    }

    .page {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 28px 18px 60px;
      position: relative;
      z-index: 1;
    }

    .hero {
      padding: 12px 0 18px;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    }

    .brand-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 20px;
    }

    .brand {
      margin: 0;
      font-size: clamp(30px, 7vw, 72px);
      line-height: 0.92;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      font-weight: 900;
      color: var(--text);
    }

    .brand .accent {
      color: var(--red-6);
      text-shadow: 0 0 22px rgba(217,45,66,0.26);
    }

    .badge {
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 9px;
      opacity: 0.82;
    }

    .panel {
      position: relative;
      background: linear-gradient(180deg, rgba(20,20,20,0.85), rgba(10,10,10,0.92));
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 22px 46px rgba(0,0,0,0.42), inset 0 0 0 1px rgba(255,255,255,0.02);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(255,255,255,0.02), transparent 24%, transparent 76%, rgba(177,13,30,0.08));
      pointer-events: none;
    }

    .release-card {
      padding: 18px;
    }

    .release-top,
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .title,
    .card-title {
      margin: 0;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--text);
    }

    .title {
      font-size: clamp(18px, 3vw, 30px);
    }

    .card-title {
      font-size: clamp(16px, 2.6vw, 24px);
    }

    .small-tag {
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 9px;
      opacity: 0.8;
    }

    .release-main {
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr);
      gap: 22px;
      align-items: center;
    }

    .cover-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-wrap::before {
      content: "";
      position: absolute;
      inset: -8px;
      background: radial-gradient(circle, var(--glow), transparent 60%);
      filter: blur(12px);
      z-index: 0;
    }

    .cover {
      position: relative;
      z-index: 1;
      width: 100%;
      aspect-ratio: 1;
      display: block;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.09);
      background: #171717;
      box-shadow: 0 20px 34px rgba(0,0,0,0.48), inset 0 0 26px rgba(255,255,255,0.02);
      transition: transform 0.45s cubic-bezier(.22,1,.36,1), box-shadow 0.45s ease, filter 0.45s ease;
    }

    .cover-wrap:hover .cover {
      transform: scale(1.02) rotate(-1deg);
      filter: saturate(1.15) contrast(1.08);
      box-shadow: 0 28px 50px rgba(0,0,0,0.6), 0 0 32px rgba(177,13,30,0.12);
    }

    .release-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 12px 18px;
      border-radius: 12px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 10px;
      font-weight: 800;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, filter 0.2s ease;
      user-select: none;
    }

    .button.primary {
      background: linear-gradient(180deg, var(--red-5), var(--red-4));
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 14px 26px rgba(177,13,30,0.24), 0 0 0 1px rgba(255,255,255,0.02);
    }

    .button.secondary {
      background: rgba(255,255,255,0.02);
      color: var(--text);
      border: 1px solid var(--line-strong);
    }

    .button:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
      box-shadow: 0 18px 30px rgba(0,0,0,0.22);
    }

    .stack {
      display: grid;
      gap: 18px;
      margin-top: 18px;
    }

    .card {
      padding: 18px 16px;
    }

    .accounts-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .reveal {
      opacity: 0;
      transform: translateY(28px);
      filter: blur(10px);
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(.22,1,.36,1), filter 0.8s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }

    @media (max-width: 720px) {
      .release-main {
        grid-template-columns: 1fr;
      }

      .brand-row {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @media (max-width: 540px) {
      .page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .release-actions,
      .accounts-grid {
        grid-template-columns: 1fr;
      }

      .brand {
        letter-spacing: 0.18em;
      }

      .title {
        letter-spacing: 0.12em;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero reveal">
      <div class="brand-row">
        <h1 class="brand">La<span class="accent">Me</span></h1>
        <div class="badge">official</div>
      </div>
    </header>

    <main class="stack">
      <section class="panel release-card reveal">
        <div class="release-top">
          <h2 class="title">Suppressed Scream</h2>
          <div class="small-tag">single</div>
        </div>

        <div class="release-main">
          <div class="cover-wrap">
            <img class="cover" src="./ac.png" alt="Suppressed Scream cover art" />
          </div>

          <div class="release-actions">
            <a class="button primary" href="https://youtu.be/mz3qG9PVwJc?si=T6bikvwP0WClXUt5" target="_blank" rel="noreferrer">YouTube</a>
            <a class="button secondary" href="https://www.bandlab.com/post/385c45b9-63f3-440d-a55e-360ce27cd58b" target="_blank" rel="noreferrer">BandLab</a>
          </div>
        </div>
      </section>

      <section class="panel card reveal">
        <div class="card-head">
          <h2 class="card-title">Accounts</h2>
          <div class="small-tag">follow</div>
        </div>

        <div class="accounts-grid">
          <a class="button primary" href="https://www.youtube.com/@LaMe_is_trash" target="_blank" rel="noreferrer">YouTube</a>
          <a class="button secondary" href="https://www.instagram.com/lame_is_trash?cplk=eDV3OGV2b3YwOWNj&utm_source=qr" target="_blank" rel="noreferrer">Instagram</a>
          <a class="button secondary" href="https://www.bandlab.com/lame_official" target="_blank" rel="noreferrer">BandLab</a>
        </div>
      </section>
    </main>
  </div>

  <script>
    const revealItems = document.querySelectorAll('.reveal');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, {
      threshold: 0.18,
      rootMargin: '0px 0px -30px 0px'
    });

    revealItems.forEach((item) => observer.observe(item));
  </script>
</body>
</html>
