<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaMe</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --line: #2b2b2b;
      --panel: #111111;
      --text: #f2f2f2;
      --muted: #a7a7a7;
      --red: #b61125;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 18px;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      background: #101010;
      border: 1px solid var(--line);
      padding: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .brand {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .brand span { color: var(--red); }

    .admin-btn,
    .btn,
    .fake-btn,
    button {
      background: #1b1b1b;
      color: var(--text);
      border: 1px solid var(--line);
      padding: 8px 10px;
      cursor: pointer;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .btn.primary,
    .fake-btn.primary {
      background: var(--red);
      border-color: var(--red);
    }

    .panel {
      background: #0f0f0f;
      border: 1px solid var(--line);
      padding: 12px;
      margin-bottom: 12px;
    }

    .meta {
      margin-top: 0;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .title-main {
      margin-top: 6px;
      font-size: 26px;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0;
    }

    .hidden { display: none !important; }

    input[type="file"] { display: none; }

    .loader {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      margin: 12px 0;
      border: 1px solid var(--line);
      background: #0f0f0f;
      color: var(--text);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #4a4a4a;
      border-top-color: var(--white);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .player-box {
      border: 1px solid var(--line);
      background: #121212;
      padding: 10px;
      margin-top: 12px;
    }

    audio, video {
      width: 100%;
      display: block;
      background: #000;
    }

    .note {
      margin-top: 12px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      background: #111;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .list {
      list-style: none;
      margin: 14px 0 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .item {
      display: grid;
      grid-template-columns: 38px 1fr auto auto;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      padding: 8px;
      background: #0e0e0e;
    }

    .play {
      width: 34px;
      height: 34px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      cursor: pointer;
      font-size: 12px;
    }

    .play.active {
      background: var(--red);
      border-color: var(--red);
    }

    .name {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kind {
      display: block;
      margin-top: 2px;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .duration {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .delete {
      display: none;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .app.admin .delete { display: inline-block; }

    .empty {
      padding: 18px 12px;
      text-align: center;
      background: #0f0f0f;
      border: 1px dashed var(--line);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .version {
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: #111;
      border: 1px solid var(--line);
      padding: 5px 8px;
      color: var(--text);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      body { padding: 12px; }
      .item { grid-template-columns: 34px 1fr auto; }
      .delete { grid-column: 2 / 4; width: 100%; }
      .brand { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div id="app" class="wrap">
    <div class="topbar">
      <div class="brand">La<span>Me</span></div>
      <button class="admin-btn" id="adminBtn">Admin</button>
    </div>

    <div class="panel">
      <div class="meta">Latest release</div>
      <div id="activeTitle" class="title-main">No track yet</div>
    </div>

    <div id="adminControls" class="controls hidden">
      <label class="fake-btn primary" for="mediaInput">Upload</label>
    </div>

    <div id="uploadLoader" class="loader hidden">
      <div class="spinner"></div>
      <span>Uploading...</span>
    </div>

    <input id="mediaInput" type="file" accept="audio/*,video/*,.dat,.mp3,.wav,.ogg,.aac,.m4a,.flac,.mp4,.m4v,.mov,.avi,.webm,.3gp,.3g2" multiple />

    <div class="player-box">
      <audio id="audioPlayer" controls preload="metadata"></audio>
      <video id="videoPlayer" controls preload="metadata" class="hidden"></video>
    </div>

    <div class="note">iPhone: .MOV / .MP4 / .M4V supported</div>

    <ul id="trackList" class="list"></ul>
  </div>

  <div id="version" class="version">v0.4</div>

  <script>
    const ADMIN_PASSWORD = 'LaMeMetal2026';
    const STORAGE_KEY = 'lame_tracks_v2';
    const ACCESS_KEY = 'lame_admin_access';
    const APP_VERSION = 'v0.4';

    const app = document.getElementById('app');
    const adminBtn = document.getElementById('adminBtn');
    const adminControls = document.getElementById('adminControls');
    const uploadLoader = document.getElementById('uploadLoader');
    const audioPlayer = document.getElementById('audioPlayer');
    const videoPlayer = document.getElementById('videoPlayer');
    const mediaInput = document.getElementById('mediaInput');
    const trackList = document.getElementById('trackList');
    const activeTitle = document.getElementById('activeTitle');
    const version = document.getElementById('version');

    let tracks = [];
    let activeIndex = -1;

    function setVersion() {
      version.textContent = APP_VERSION;
    }

    function showLoader() {
      if (uploadLoader) uploadLoader.classList.remove('hidden');
    }

    function hideLoader() {
      if (uploadLoader) uploadLoader.classList.add('hidden');
    }

    function hasAccess() {
      return localStorage.getItem(ACCESS_KEY) === 'allowed';
    }

    function unlockAdmin() {
      const password = prompt('Password:');
      if (password === ADMIN_PASSWORD) {
        localStorage.setItem(ACCESS_KEY, 'allowed');
        app.classList.add('admin');
        adminControls.classList.remove('hidden');
        return true;
      }
      alert('Access denied.');
      return false;
    }

    function setAdminState() {
      if (hasAccess()) {
        app.classList.add('admin');
        adminControls.classList.remove('hidden');
      }
    }

    function saveTracks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tracks));
    }

    function loadTracks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return;
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) tracks = parsed;
      } catch (e) {
        console.error('Load tracks error:', e);
      }
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function isAudioFile(file) {
      const name = (file && file.name) ? file.name.toLowerCase() : '';
      return file && (
        file.type.startsWith('audio/') ||
        /\.(mp3|wav|ogg|aac|m4a|flac|dat)$/i.test(name)
      );
    }

    function isVideoFile(file) {
      const name = (file && file.name) ? file.name.toLowerCase() : '';
      return file && (
        file.type.startsWith('video/') ||
        /\.(mp4|m4v|mov|avi|webm|3gp|3g2|mpeg|ogv)$/i.test(name)
      );
    }

    function isPlayable(file) {
      return isAudioFile(file) || isVideoFile(file);
    }

    function updateMediaSource(track) {
      audioPlayer.pause();
      videoPlayer.pause();
      audioPlayer.removeAttribute('src');
      videoPlayer.removeAttribute('src');
      audioPlayer.classList.toggle('hidden', !!track && track.kind === 'video');
      videoPlayer.classList.toggle('hidden', !track || track.kind !== 'video');

      if (!track) return;
      if (track.kind === 'video') videoPlayer.src = track.url;
      else audioPlayer.src = track.url;
    }

    function renderTracks() {
      trackList.innerHTML = '';

      if (!tracks.length) {
        trackList.innerHTML = '<li class="empty">No tracks</li>';
        return;
      }

      tracks.forEach((track, index) => {
        const li = document.createElement('li');
        li.className = 'item';

        const playBtn = document.createElement('button');
        playBtn.className = 'play' + (activeIndex === index ? ' active' : '');
        const isPlaying = activeIndex === index && ((track.kind === 'video' && !videoPlayer.paused) || (track.kind !== 'video' && !audioPlayer.paused));
        playBtn.textContent = isPlaying ? '||' : '▶';
        playBtn.addEventListener('click', () => playTrack(index));

        const textWrap = document.createElement('div');
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = track.name;
        const kind = document.createElement('span');
        kind.className = 'kind';
        kind.textContent = track.kind || 'audio';
        textWrap.appendChild(name);
        textWrap.appendChild(kind);

        const duration = document.createElement('div');
        duration.className = 'duration';
        duration.textContent = track.duration || '—';

        const del = document.createElement('button');
        del.className = 'delete';
        del.textContent = 'Delete';
        del.addEventListener('click', () => deleteTrack(index));

        li.appendChild(playBtn);
        li.appendChild(textWrap);
        li.appendChild(duration);
        li.appendChild(del);
        trackList.appendChild(li);
      });
    }

    function playTrack(index) {
      const track = tracks[index];
      if (!track) return;

      if (activeIndex === index) {
        if (track.kind === 'video') {
          if (videoPlayer.paused) videoPlayer.play();
          else videoPlayer.pause();
        } else {
          if (audioPlayer.paused) audioPlayer.play();
          else audioPlayer.pause();
        }
      } else {
        activeIndex = index;
        activeTitle.textContent = track.name;
        updateMediaSource(track);
        if (track.kind === 'video') videoPlayer.play();
        else audioPlayer.play();
      }

      renderTracks();
    }

    function deleteTrack(index) {
      if (!hasAccess()) {
        unlockAdmin();
        return;
      }

      tracks.splice(index, 1);
      if (activeIndex >= tracks.length) activeIndex = tracks.length - 1;
      saveTracks();
      renderTracks();

      if (!tracks.length) {
        activeTitle.textContent = 'No track yet';
        audioPlayer.pause();
        videoPlayer.pause();
        audioPlayer.removeAttribute('src');
        videoPlayer.removeAttribute('src');
        return;
      }

      if (activeIndex >= 0) {
        const chosen = tracks[activeIndex];
        activeTitle.textContent = chosen.name;
        updateMediaSource(chosen);
      }
    }

    async function handleMediaUpload(files) {
      if (!hasAccess()) {
        const ok = unlockAdmin();
        if (!ok) return;
      }

      const valid = Array.from(files).filter(isPlayable);
      if (!valid.length) {
        alert('Only audio/video files are allowed.');
        return;
      }

      showLoader();

      try {
        for (const file of valid) {
          const maxSize = isVideoFile(file) ? 50 * 1024 * 1024 : 25 * 1024 * 1024;
          if (file.size > maxSize) {
            alert('File is too large.');
            continue;
          }

          const dataUrl = await readFileAsDataUrl(file);
          tracks.push({
            name: file.name.replace(/\.[^.]+$/, ''),
            url: dataUrl,
            kind: isVideoFile(file) ? 'video' : 'audio',
            duration: '—'
          });
        }

        saveTracks();
        renderTracks();

        if (tracks.length && activeIndex < 0) {
          activeIndex = 0;
          playTrack(0);
        }
      } finally {
        hideLoader();
        mediaInput.value = '';
      }
    }

    function formatDuration(seconds) {
      if (!isFinite(seconds)) return '—';
      const total = Math.floor(seconds);
      const m = Math.floor(total / 60);
      const s = total % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function bindDuration(player, track) {
      if (!track) return;
      const sec = Number.isFinite(player.duration) ? player.duration : 0;
      if (sec > 0) {
        track.duration = formatDuration(sec);
        saveTracks();
        renderTracks();
      }
    }

    function setupEvents() {
      adminBtn.addEventListener('click', () => {
        if (hasAccess()) {
          app.classList.add('admin');
          adminControls.classList.remove('hidden');
          return;
        }
        unlockAdmin();
      });

      mediaInput.addEventListener('change', (event) => {
        handleMediaUpload(event.target.files || []);
      });

      audioPlayer.addEventListener('loadedmetadata', () => {
        const track = tracks[activeIndex];
        if (!track || track.kind !== 'audio') return;
        bindDuration(audioPlayer, track);
      });

      videoPlayer.addEventListener('loadedmetadata', () => {
        const track = tracks[activeIndex];
        if (!track || track.kind !== 'video') return;
        bindDuration(videoPlayer, track);
      });
    }

    function init() {
      setVersion();
      loadTracks();
      setAdminState();
      renderTracks();
      setupEvents();
    }

    init();
  </script>
</body>
</html>
