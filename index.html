<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaMe</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --panel: #111111;
      --panel-2: #181818;
      --line: #2b2b2b;
      --text: #f3f3f3;
      --muted: #a3a3a3;
      --red: #b61125;
      --red-soft: #d12338;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .box {
      width: min(100%, 760px);
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 24px;
    }

    .brand {
      margin: 0 0 20px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .brand span {
      color: var(--red);
    }

    .track-group {
      margin-top: 18px;
      padding: 18px 16px;
      border: 1px solid var(--line);
      background: var(--panel-2);
    }

    .track-title {
      margin: 0 0 14px;
      font-size: 18px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
    }

    .platforms {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .platform-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 12px 16px;
      border: 1px solid var(--red);
      background: var(--red);
      color: var(--text);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 10px;
      font-weight: 700;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .platform-btn.secondary {
      background: transparent;
      border-color: var(--line);
      color: var(--text);
    }

    .platform-btn:hover {
      background: var(--red-soft);
      border-color: var(--red-soft);
    }

    .platform-btn.secondary:hover {
      background: #1a1a1a;
      border-color: var(--text);
    }

    .tiny-link {
      display: block;
      margin-top: 14px;
      color: var(--muted);
      text-decoration: none;
      word-break: break-all;
      line-height: 1.6;
      font-size: 13px;
    }

    .tiny-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="box">
    <div class="brand">La<span>Me</span></div>

    <section class="track-group">
      <h2 class="track-title">Suppressed Scream</h2>

      <div class="platforms">
        <a class="platform-btn" href="https://www.bandlab.com/post/385c45b9-63f3-440d-a55e-360ce27cd58b" target="_blank" rel="noreferrer">
          BandLab
        </a>

        <a class="platform-btn secondary" href="https://youtu.be/mz3qG9PVwJc?si=T6bikvwP0WClXUt5" target="_blank" rel="noreferrer">
          YouTube
        </a>
      </div>

      <a class="tiny-link" href="https://www.bandlab.com/post/385c45b9-63f3-440d-a55e-360ce27cd58b" target="_blank" rel="noreferrer">
        https://www.bandlab.com/post/385c45b9-63f3-440d-a55e-360ce27cd58b
      </a>

      <a class="tiny-link" href="https://youtu.be/mz3qG9PVwJc?si=T6bikvwP0WClXUt5" target="_blank" rel="noreferrer">
        https://youtu.be/mz3qG9PVwJc?si=T6bikvwP0WClXUt5
      </a>
    </section>
  </main>
</body>
</html>
