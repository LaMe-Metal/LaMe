<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaMe</title>
  <style>
    :root {
      --bg: #090909;
      --panel: #121212;
      --panel-soft: #1b1b1b;
      --line: rgba(255,255,255,0.08);
      --text: #f5efef;
      --muted: #b9afaf;
      --red: #c91428;
      --red-2: #ef475f;
      --shadow: rgba(0,0,0,0.38);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background:
        radial-gradient(circle at top left, rgba(201,20,40,0.18), transparent 25%),
        radial-gradient(circle at bottom right, rgba(239,71,95,0.12), transparent 30%),
        var(--bg);
    }

    .app {
      width: min(100%, 560px);
      min-height: 100vh;
      padding: 18px 16px 40px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px 18px;
    }

    .logo {
      font-family: Impact, Haettenschweiler, 'Arial Black', sans-serif;
      font-size: clamp(26px, 8vw, 40px);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .logo span { color: var(--red-2); }

    .admin-btn {
      border: 1px solid var(--line);
      background: #171717;
      color: var(--text);
      padding: 9px 12px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .hero {
      background: linear-gradient(180deg, rgba(22,22,22,0.95), rgba(12,12,12,1));
      border: 1px solid var(--line);
      box-shadow: 0 18px 34px var(--shadow);
      overflow: hidden;
    }

    .cover-box {
      width: 100%;
      height: 280px;
      background: linear-gradient(135deg, var(--red), #2a0a11);
      display: grid;
      place-items: center;
      font-family: Impact, Haettenschweiler, 'Arial Black', sans-serif;
      font-size: clamp(66px, 18vw, 110px);
      color: white;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: 0.2s ease;
    }

    .hero-meta {
      padding: 18px 18px 20px;
    }
    .hero-meta small {
      display: block;
      color: var(--red-2);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .hero-meta h2 {
      margin: 0;
      font-size: clamp(24px, 7vw, 38px);
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 18px 0 8px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 42px;
      border: 1px solid rgba(255,255,255,0.1);
      background: var(--panel-soft);
      color: var(--text);
      padding: 10px 12px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }
    .button.primary {
      background: var(--red);
      border-color: var(--red);
    }
    .button:hover { opacity: 0.95; }

    input[type="file"] {
      display: none;
    }

    .player-box {
      margin-top: 14px;
      background: rgba(18,18,18,0.7);
      border: 1px solid var(--line);
      padding: 12px 12px 10px;
    }
    audio, video {
      width: 100%;
      display: block;
      outline: none;
      max-height: 300px;
      background: #000;
    }
    .hidden {
      display: none !important;
    }

    .track-list {
      margin: 18px 0 0;
      list-style: none;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .track-item {
      display: grid;
      grid-template-columns: 42px 1fr auto auto;
      align-items: center;
      gap: 12px;
      background: rgba(19,19,19,0.8);
      border: 1px solid var(--line);
      padding: 10px 10px;
    }

    .play-btn {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
    }
    .play-btn.active {
      background: var(--red);
      border-color: var(--red);
    }

    .track-name {
      font-size: 15px;
      font-weight: 700;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .track-meta {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      display: block;
      margin-top: 4px;
    }

    .delete-btn {
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: var(--text);
      padding: 8px 9px;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      display: none;
    }
    .app.admin .delete-btn { display: block; }

    .empty {
      background: rgba(20,20,20,0.8);
      border: 1px dashed rgba(255,255,255,0.12);
      color: var(--muted);
      text-align: center;
      padding: 24px 12px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 10px;
    }

    @media (max-width: 420px) {
      .controls { grid-template-columns: 1fr; }
      .cover-box { height: 240px; }
      .track-item { grid-template-columns: 42px 1fr auto; }
      .delete-btn { grid-column: 2 / 4; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <div class="logo">La<span>Me</span></div>
      <button class="admin-btn" id="adminBtn">Admin</button>
    </header>

    <section class="hero">
      <div class="cover-box" id="coverBox">L</div>
      <div class="hero-meta">
        <small>Latest release</small>
        <h2 id="activeTitle">No track yet</h2>
      </div>
    </section>

    <div class="controls hidden" id="adminControls">
      <label class="button primary" for="mediaInput">Upload media</label>
      <label class="button" for="coverInput">Upload cover</label>
    </div>

    <input id="mediaInput" type="file" accept="audio/*,video/*,.dat,.mp3,.wav,.ogg,.aac,.m4a,.flac,.mp4,.webm,.m4v,.mov,.avi" multiple />
    <input id="coverInput" type="file" accept="image/*" />

    <div class="player-box">
      <audio id="audioPlayer" controls preload="metadata"></audio>
      <video id="videoPlayer" controls preload="metadata" class="hidden"></video>
    </div>

    <ul id="trackList" class="track-list"></ul>
  </div>

  <script>
    const ADMIN_PASSWORD = 'LaMeMetal2026';
    const STORAGE_KEY = 'lame_tracks_v2';
    const COVER_KEY = 'lame_cover_v2';
    const ACCESS_KEY = 'lame_admin_access';

    const adminBtn = document.getElementById('adminBtn');
    const adminControls = document.getElementById('adminControls');
    const app = document.getElementById('app');
    const audioPlayer = document.getElementById('audioPlayer');
    const videoPlayer = document.getElementById('videoPlayer');
    const trackList = document.getElementById('trackList');
    const coverBox = document.getElementById('coverBox');
    const activeTitle = document.getElementById('activeTitle');
    const mediaInput = document.getElementById('mediaInput');
    const coverInput = document.getElementById('coverInput');

    let tracks = [];
    let activeIndex = -1;

    function isAudioFile(file) {
      const name = (file && file.name) ? file.name.toLowerCase() : '';
      return file && (
        file.type.startsWith('audio/') ||
        /\.(mp3|wav|ogg|aac|m4a|flac|dat)$/i.test(name)
      );
    }

    function isVideoFile(file) {
      const name = (file && file.name) ? file.name.toLowerCase() : '';
      return file && (
        file.type.startsWith('video/') ||
        /\.(mp4|webm|m4v|mov|avi|mpeg|3gp|ogv)$/i.test(name)
      );
    }

    function isPlayableMediaFile(file) {
      return isAudioFile(file) || isVideoFile(file);
    }

    function hasAccess() {
      return localStorage.getItem(ACCESS_KEY) === 'allowed';
    }

    function unlockAdmin() {
      const password = prompt('Zadej heslo pro upload a mazání médií:');
      if (password === ADMIN_PASSWORD) {
        localStorage.setItem(ACCESS_KEY, 'allowed');
        app.classList.add('admin');
        adminControls.classList.remove('hidden');
        return true;
      }
      alert('Přístup zamítnut.');
      return false;
    }

    function setAdminState() {
      if (hasAccess()) {
        app.classList.add('admin');
        adminControls.classList.remove('hidden');
      }
    }

    function saveTracks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tracks));
    }

    function loadTracks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return;
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) tracks = parsed;
      } catch (e) {
        console.error('Error loading tracks:', e);
      }
    }

    function setCover(dataUrl) {
      if (!dataUrl) return;
      coverBox.style.backgroundImage = `url('${dataUrl}')`;
      coverBox.textContent = '';
    }

    function clearCover() {
      coverBox.style.backgroundImage = 'linear-gradient(135deg, var(--red), #2a0a11)';
      coverBox.textContent = 'L';
      localStorage.removeItem(COVER_KEY);
    }

    function loadCover() {
      const saved = localStorage.getItem(COVER_KEY);
      if (saved) setCover(saved);
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function updateMediaPlayer(track) {
      const isVideo = track && track.kind === 'video';

      audioPlayer.pause();
      videoPlayer.pause();
      audioPlayer.removeAttribute('src');
      videoPlayer.removeAttribute('src');
      audioPlayer.classList.toggle('hidden', isVideo);
      videoPlayer.classList.toggle('hidden', !isVideo);

      if (!track) return;

      if (isVideo) {
        videoPlayer.src = track.url;
      } else {
        audioPlayer.src = track.url;
      }
    }

    function renderTracks() {
      trackList.innerHTML = '';

      if (!tracks.length) {
        trackList.innerHTML = '<li class="empty">Žádné skladby</li>';
        return;
      }

      tracks.forEach((track, index) => {
        const li = document.createElement('li');
        li.className = 'track-item';

        const playBtn = document.createElement('button');
        playBtn.className = 'play-btn' + (activeIndex === index ? ' active' : '');
        const isCurrentVideo = activeIndex === index && tracks[index].kind === 'video';
        const isCurrentPlaying = activeIndex === index && ((tracks[index].kind === 'video' && !videoPlayer.paused) || (tracks[index].kind !== 'video' && !audioPlayer.paused));
        playBtn.textContent = isCurrentPlaying ? '||' : '▶';
        playBtn.addEventListener('click', () => playTrack(index));

        const info = document.createElement('div');
        const name = document.createElement('span');
        name.className = 'track-name';
        name.textContent = track.name;
        const meta = document.createElement('span');
        meta.className = 'track-meta';
        meta.textContent = track.kind || 'audio';
        info.appendChild(name);
        info.appendChild(meta);

        const duration = document.createElement('span');
        duration.className = 'track-meta';
        duration.textContent = track.duration || '—';

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = 'Delete';
        deleteBtn.addEventListener('click', () => deleteTrack(index));

        li.appendChild(playBtn);
        li.appendChild(info);
        li.appendChild(duration);
        li.appendChild(deleteBtn);
        trackList.appendChild(li);
      });
    }

    function playTrack(index) {
      const track = tracks[index];
      if (!track) return;

      if (activeIndex === index) {
        if (track.kind === 'video') {
          if (videoPlayer.paused) videoPlayer.play();
          else videoPlayer.pause();
        } else {
          if (audioPlayer.paused) audioPlayer.play();
          else audioPlayer.pause();
        }
      } else {
        activeIndex = index;
        activeTitle.textContent = track.name;
        updateMediaPlayer(track);
        if (track.kind === 'video') {
          videoPlayer.play();
        } else {
          audioPlayer.play();
        }
      }

      renderTracks();
    }

    function deleteTrack(index) {
      if (!hasAccess()) {
        unlockAdmin();
        return;
      }

      tracks.splice(index, 1);
      if (activeIndex >= tracks.length) activeIndex = tracks.length - 1;
      saveTracks();
      renderTracks();

      if (tracks.length === 0) {
        activeTitle.textContent = 'No track yet';
        audioPlayer.pause();
        videoPlayer.pause();
        audioPlayer.removeAttribute('src');
        videoPlayer.removeAttribute('src');
        return;
      }

      if (activeIndex >= 0) {
        const chosen = tracks[activeIndex];
        activeTitle.textContent = chosen.name;
        updateMediaPlayer(chosen);
      }
    }

    async function handleMediaUpload(files) {
      if (!hasAccess()) {
        const ok = unlockAdmin();
        if (!ok) return;
      }

      const valid = Array.from(files).filter(isPlayableMediaFile);
      if (!valid.length) {
        alert('Pouze audio nebo video soubory (.mp3, .wav, .ogg, .aac, .m4a, .flac, .dat, .mp4, .webm, .mov, .avi).');
        return;
      }

      for (const file of valid) {
        const maxSize = isVideoFile(file) ? 50 * 1024 * 1024 : 25 * 1024 * 1024;
        if (file.size > maxSize) {
          alert('Soubor je moc velký. Zvol menší mediální soubor.');
          continue;
        }

        const dataUrl = await readFileAsDataUrl(file);
        tracks.push({
          name: file.name.replace(/\.[^.]+$/, ''),
          url: dataUrl,
          kind: isVideoFile(file) ? 'video' : 'audio',
          type: isVideoFile(file) ? 'video' : 'audio',
          duration: '—'
        });
      }

      saveTracks();
      renderTracks();
      if (tracks.length && activeIndex < 0) {
        activeIndex = 0;
        playTrack(0);
      }
      mediaInput.value = '';
    }

    async function handleCoverUpload(file) {
      if (!hasAccess()) {
        const ok = unlockAdmin();
        if (!ok) return;
      }

      if (!file || !file.type.startsWith('image/')) {
        alert('Pouze obrázek pro obal.');
        return;
      }

      if (file.size > 2 * 1024 * 1024) {
        alert('Obrázek je moc velký. Zvol menší soubor.');
        return;
      }

      const dataUrl = await readFileAsDataUrl(file);
      localStorage.setItem(COVER_KEY, dataUrl);
      setCover(dataUrl);
      coverInput.value = '';
    }

    function bindMediaDuration(player, track) {
      if (!track) return;
      const seconds = Number.isFinite(player.duration) ? player.duration : 0;
      if (seconds > 0) {
        track.duration = formatDuration(seconds);
        saveTracks();
        renderTracks();
      }
    }

    function setupEvents() {
      adminBtn.addEventListener('click', () => {
        if (hasAccess()) {
          app.classList.add('admin');
          adminControls.classList.remove('hidden');
          return;
        }
        unlockAdmin();
      });

      mediaInput.addEventListener('change', (event) => {
        handleMediaUpload(event.target.files || []);
      });

      coverInput.addEventListener('change', (event) => {
        const file = event.target.files && event.target.files[0];
        handleCoverUpload(file);
      });

      audioPlayer.addEventListener('loadedmetadata', () => {
        const track = tracks[activeIndex];
        if (!track || track.kind !== 'audio') return;
        bindMediaDuration(audioPlayer, track);
      });

      videoPlayer.addEventListener('loadedmetadata', () => {
        const track = tracks[activeIndex];
        if (!track || track.kind !== 'video') return;
        bindMediaDuration(videoPlayer, track);
      });
    }

    function formatDuration(seconds) {
      if (!isFinite(seconds)) return '—';
      const total = Math.floor(seconds);
      const m = Math.floor(total / 60);
      const s = total % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function init() {
      loadTracks();
      loadCover();
      setAdminState();
      renderTracks();
      setupEvents();
    }

    init();
  </script>
</body>
</html>
