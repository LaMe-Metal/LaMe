<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaMe</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --line: #2b2b2b;
      --text: #f3f3f3;
      --muted: #a5a5a5;
      --red: #b61125;
      --panel: #101010;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: min(100%, 720px);
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 18px;
    }

    .brand {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .brand span {
      color: var(--red);
    }

    .upload-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    input[type="file"] {
      display: none;
    }

    .fake-btn {
      display: inline-block;
      background: var(--red);
      color: var(--text);
      border: 1px solid var(--red);
      padding: 10px 14px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .status {
      display: none;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      border: 1px solid var(--line);
      background: #0e0e0e;
      color: var(--text);
      padding: 8px 12px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .status.show {
      display: flex;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #444;
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .status.loading .spinner {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .video-box {
      display: none;
      margin-top: 12px;
      border: 1px solid var(--line);
      background: #0d0d0d;
      padding: 10px;
    }

    .video-box.show {
      display: block;
    }

    video {
      width: 100%;
      display: block;
      background: #000;
    }

    .file-name {
      margin-top: 10px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      word-break: break-all;
    }

    .version {
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: #111;
      border: 1px solid var(--line);
      padding: 5px 8px;
      color: var(--text);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="brand">La<span>Me</span></div>

    <div class="upload-wrap">
      <label class="fake-btn" for="mp4Input">Upload MP4</label>
      <input id="mp4Input" type="file" accept="video/mp4,video/x-m4v,.mp4,.m4v" />
    </div>

    <div id="status" class="status">
      <div class="spinner"></div>
      <span id="statusText">Uploading...</span>
    </div>

    <div id="videoBox" class="video-box">
      <video id="videoPlayer" controls playsinline></video>
      <div id="fileName" class="file-name"></div>
    </div>
  </div>

  <div class="version">v0.6</div>

  <script>
    const mp4Input = document.getElementById('mp4Input');
    const status = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const videoBox = document.getElementById('videoBox');
    const videoPlayer = document.getElementById('videoPlayer');
    const fileName = document.getElementById('fileName');

    function showStatus(text, loading) {
      status.classList.add('show');
      status.classList.toggle('loading', !!loading);
      statusText.textContent = text;
    }

    function hideStatus() {
      status.classList.remove('show');
      status.classList.remove('loading');
    }

    function handleMp4(file) {
      if (!file) return;

      const name = file.name.toLowerCase();
      const ok = file.type === 'video/mp4' || file.type === 'video/x-m4v' || /\.(mp4|m4v)$/i.test(name);

      if (!ok) {
        showStatus('Only MP4', false);
        setTimeout(() => hideStatus(), 1200);
        return;
      }

      if (file.size > 80 * 1024 * 1024) {
        showStatus('File too large', false);
        setTimeout(() => hideStatus(), 1200);
        return;
      }

      showStatus('Uploading...', true);

      const objUrl = URL.createObjectURL(file);
      videoPlayer.src = objUrl;
      videoPlayer.load();
      fileName.textContent = file.name;
      videoBox.classList.add('show');

      setTimeout(() => {
        hideStatus();
      }, 900);
    }

    mp4Input.addEventListener('change', (event) => {
      const file = event.target.files && event.target.files[0];
      handleMp4(file);
    });
  </script>
</body>
</html>
